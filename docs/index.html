    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;

  const isArray = Array.isArray;

  const parse = JSON.parse;

    &quot;codex-visualization-widget-state&quot;,
  );

  initialStateElement?.remove();

  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();

    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );

   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;

      throw new Error(`Missing ${property} getter`);

    return getter;
  };

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);

  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  const postToHost = (type, payload) =&gt; {

      nextState == null ||
      typeof nextState !== &quot;object&quot; ||

    }

      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());

      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,

      widgetState: state,
      statePersistence,

    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };

    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {

                }

            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }

    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }

        target == null ||
        globalThis.navigator.userActivation?.isActive !== true

        return;

        top: target.getBoundingClientRect().top + globalThis.scrollY,

    }

  });

  syncTheme();

&lt;script type=&quot;application/json&quot; id=&quot;atlas-data&quot;&gt;[{&quot;id&quot;: &quot;T01-001&quot;, &quot;title&quot;: &quot;按指令放置物体&quot;, &quot;category&quot;: &quot;抓取、搬运与放置&quot;, &quot;short&quot;: &quot;抓取、搬运与放置&quot;, &quot;mini&quot;: &quot;按指令放置&quot;, &quot;core&quot;: true, &quot;scene&quot;: &quot;桌面放一个可抓取积木、浅盒和一张固定坐标参照垫；所有目标都可见。积木、盒子和材质固定，避免同时测试新物体。平台：桌面机械臂。&quot;, &quot;training&quot;: &quot;分别练习“放入盒子”和“放到参照垫前侧”；提供两个关系词的独立示例，不提供同一回合的组合指令。&quot;, &quot;common&quot;: &quot;积木到达当前指令定义的终点，夹爪释放且稳定 3 秒；不得掉落桌外或移动参照垫。前侧指参照垫印刷箭头方向，避免观察视角歧义。关系区域和边界容差在实例中固定。&quot;, &quot;configs&quot;: {&quot;B&quot;: {&quot;instruction&quot;: &quot;“将积木放入浅盒。”浅盒静止。&quot;, &quot;success&quot;: &quot;积木完全在盒内并满足共用条件。&quot;, &quot;claim&quot;: &quot;D1；基础抓放可执行。&quot;}, &quot;G&quot;: {&quot;instruction&quot;: &quot;“先放入浅盒，再取出放到参照垫前侧。”&quot;, &quot;success&quot;: &quot;日志中确实先入盒并释放，随后取出到前侧；不是直接跳到终点。&quot;, &quot;claim&quot;: &quot;D2，G-C；能执行留出的两阶段组合。&quot;}, &quot;P&quot;: {&quot;instruction&quot;: &quot;B 指令；首次抓起积木、尚未接近盒子时，盒子横移 10 厘米后静止。&quot;, &quot;success&quot;: &quot;放入移动后的盒子；到旧位置不算成功。&quot;, &quot;claim&quot;: &quot;D2，G-P；能根据目标位置变化更新抓放。&quot;}, &quot;GP&quot;: {&quot;instruction&quot;: &quot;G 指令；在同一首次抓起阶段施加相同盒子位移。&quot;, &quot;success&quot;: &quot;在新盒位完成中间放置，再放到固定参照垫前侧。&quot;, &quot;claim&quot;: &quot;D3；该组合在目标移动下仍成立。&quot;}}, &quot;axis&quot;: &quot;G-C&quot;, &quot;boundary&quot;: &quot;诊断：G 低而 P 高提示组合执行问题；G 高而 P 低提示目标更新/闭环控制问题。该判断是候选解释，需行为日志核实。不能由此证明对未知杯子、摩擦或新机器人泛化。参考：LIBERO、VIMA-Bench。&quot;, &quot;previews&quot;: {&quot;B&quot;: &quot;积木入盒&quot;, &quot;G&quot;: &quot;入盒 → 取出 → 放前侧&quot;, &quot;P&quot;: &quot;盒子横移 10 cm&quot;, &quot;GP&quot;: &quot;新组合 + 盒位变化&quot;}, &quot;sources&quot;: [{&quot;name&quot;: &quot;LIBERO&quot;, &quot;url&quot;: &quot;https://libero-project.github.io/&quot;}, {&quot;name&quot;: &quot;VIMA-Bench&quot;, &quot;url&quot;: &quot;https://github.com/vimalabs/VimaBench&quot;}]}, {&quot;id&quot;: &quot;T02-001&quot;, &quot;title&quot;: &quot;按属性组合规则分拣&quot;, &quot;category&quot;: &quot;分拣、排列与收纳&quot;, &quot;short&quot;: &quot;分拣、排列与收纳&quot;, &quot;mini&quot;: &quot;属性规则分拣&quot;, &quot;core&quot;: true, &quot;scene&quot;: &quot;桌面有 6 个不同颜色与大小组合的积木、两个盒子，所有积木可见且至少两件同时满足“大且红”。“大/小”通过固定尺寸阈值定义，标签可读。平台：桌面机械臂。&quot;, &quot;training&quot;: &quot;分别练习“红色放左盒，其余放右盒”和“大件放左盒，其余放右盒”；不提供“大且红”的合取分拣示例。G 与 B 使用相同物体组合。&quot;, &quot;common&quot;: &quot;6 个积木全部进入按规则指定的盒子，无遗漏、无错分、无桌外掉落；只改变物体位置，不拆分或遮盖属性。&quot;, &quot;configs&quot;: {&quot;B&quot;: {&quot;instruction&quot;: &quot;红色放左盒，其余放右盒。&quot;, &quot;success&quot;: &quot;全部物体按单属性规则正确归类。&quot;, &quot;claim&quot;: &quot;D2；能执行熟悉分类规则。&quot;}, &quot;G&quot;: {&quot;instruction&quot;: &quot;大且红的放左盒，其余放右盒。&quot;, &quot;success&quot;: &quot;每件物体满足合取规则，不能按单独颜色或大小分类。&quot;, &quot;claim&quot;: &quot;D3，G-L；能执行留出的属性规则组合。&quot;}, &quot;P&quot;: {&quot;instruction&quot;: &quot;B 指令；第 1 件放好后，把所有尚未处理物体的位置打乱一次；属性和盒位不变。&quot;, &quot;success&quot;: &quot;仍按颜色正确分拣，不把旧位置当作身份。&quot;, &quot;claim&quot;: &quot;D3，G-P；能应对剩余目标的重排。&quot;}, &quot;GP&quot;: {&quot;instruction&quot;: &quot;G 指令；施加相同剩余物体重排。&quot;, &quot;success&quot;: &quot;按“大且红”规则全部归类。&quot;, &quot;claim&quot;: &quot;D3；新规则在布局扰动下仍成立。&quot;}}, &quot;axis&quot;: &quot;G-L&quot;, &quot;boundary&quot;: &quot;诊断：错误应按属性混淆、漏处理、重复搬运分开记录。该测试不自动证明长期记忆；增加遮挡/历史顺序时另开 G-H 分支。参考：RoboDojo、VLABench、VIMA-Bench。&quot;, &quot;previews&quot;: {&quot;B&quot;: &quot;红色放左，其余放右&quot;, &quot;G&quot;: &quot;大且红放左，其余放右&quot;, &quot;P&quot;: &quot;剩余物体重排&quot;, &quot;GP&quot;: &quot;新规则 + 位置重排&quot;}, &quot;sources&quot;: [{&quot;name&quot;: &quot;VIMA-Bench&quot;, &quot;url&quot;: &quot;https://github.com/vimalabs/VimaBench&quot;}, {&quot;name&quot;: &quot;RoboDojo&quot;, &quot;url&quot;: &quot;https://robodojo-benchmark.com/&quot;}, {&quot;name&quot;: &quot;VLABench&quot;, &quot;url&quot;: &quot;https://vlabench.github.io/&quot;}]}, {&quot;id&quot;: &quot;T03-001&quot;, &quot;title&quot;: &quot;按指定关系堆叠积木&quot;, &quot;category&quot;: &quot;堆叠、支撑与平衡&quot;, &quot;short&quot;: &quot;堆叠、支撑与平衡&quot;, &quot;mini&quot;: &quot;关系堆叠&quot;, &quot;core&quot;: false, &quot;scene&quot;: &quot;三块等尺寸、平底、可稳定堆叠的积木，标签 A/B/C 清晰可见；两个底座位置。平台：桌面机械臂。&quot;, &quot;training&quot;: &quot;覆盖三块积木的识别与两块堆叠，训练不同二元上下关系，但不训练三层链式组合。&quot;, &quot;common&quot;: &quot;上下关系正确，机器人不再支撑结构，全部结构稳定 3 秒；物体不得掉落桌外。P/GP 在首次上层放置前移动已放到底座的底层积木 5 厘米，随后停止；不移动带有上层积木的结构。&quot;, &quot;configs&quot;: {&quot;B&quot;: {&quot;instruction&quot;: &quot;把 B 叠到 A 上；C 不动。&quot;, &quot;success&quot;: &quot;B 由 A 支撑，C 保留原位。&quot;, &quot;claim&quot;: &quot;D2；二层堆叠。&quot;}, &quot;G&quot;: {&quot;instruction&quot;: &quot;A 在最下、B 在中间、C 在最上。&quot;, &quot;success&quot;: &quot;三层支撑链成立并稳定。&quot;, &quot;claim&quot;: &quot;D3，G-C；关系与步骤组合迁移。&quot;}, &quot;P&quot;: {&quot;instruction&quot;: &quot;B 指令，底层 A 在放置 B 前平移。&quot;, &quot;success&quot;: &quot;B 叠到新位置的 A 上。&quot;, &quot;claim&quot;: &quot;D3，G-P；根据支撑位置变化重新对准。&quot;}, &quot;GP&quot;: {&quot;instruction&quot;: &quot;G 指令，在同一阶段平移 A。&quot;, &quot;success&quot;: &quot;调整后完成三层链并稳定。&quot;, &quot;claim&quot;: &quot;D4；三层组合在支撑位置变化下保持。&quot;}}, &quot;axis&quot;: &quot;G-C&quot;, &quot;boundary&quot;: &quot;不能由此推广到不规则物体堆叠或全身平衡。参考：RLBench、RoboTwin。&quot;, &quot;previews&quot;: {&quot;B&quot;: &quot;B 叠在 A 上&quot;, &quot;G&quot;: &quot;A → B → C 三层链&quot;, &quot;P&quot;: &quot;底层 A 平移 5 cm&quot;, &quot;GP&quot;: &quot;三层链 + 支撑位移&quot;}, &quot;sources&quot;: [{&quot;name&quot;: &quot;RLBench&quot;, &quot;url&quot;: &quot;https://github.com/stepjam/RLBench&quot;}, {&quot;name&quot;: &quot;RoboTwin&quot;, &quot;url&quot;: &quot;https://robotwin-platform.github.io/&quot;}]}, {&quot;id&quot;: &quot;T04-001&quot;, &quot;title&quot;: &quot;从抽屉取物并恢复状态&quot;, &quot;category&quot;: &quot;关节物体与设备操作&quot;, &quot;short&quot;: &quot;关节物体与设备&quot;, &quot;mini&quot;: &quot;抽屉取物&quot;, &quot;core&quot;: true, &quot;scene&quot;: &quot;一个无锁抽屉，内有目标积木，外有托盘；开合状态、把手、目标均可通过允许视角观察。平台：桌面机械臂。&quot;, &quot;training&quot;: &quot;分别练习开抽屉取物入托盘，以及独立关闭抽屉；不提供取物后关抽屉的完整组合。&quot;, &quot;common&quot;: &quot;目标在托盘内，抽屉不被破坏或整体拖离固定座。P/GP 在取物并放入托盘后，把抽屉改为半开状态；此阶段两组都存在，扰动不提供任何目标信息。&quot;, &quot;configs&quot;: {&quot;B&quot;: {&quot;instruction&quot;: &quot;从关闭抽屉中取物放托盘，最终保持抽屉全开。&quot;, &quot;success&quot;: &quot;目标在托盘内，开合达到全开容差。&quot;, &quot;claim&quot;: &quot;D3；熟悉开合与取物流程。&quot;}, &quot;G&quot;: {&quot;instruction&quot;: &quot;从关闭抽屉中取物放托盘，然后关好抽屉。&quot;, &quot;success&quot;: &quot;目标在托盘内，抽屉最终关闭；取物必须先于最终关闭。&quot;, &quot;claim&quot;: &quot;D3，G-C；能按新终态组合已有子技能。&quot;}, &quot;P&quot;: {&quot;instruction&quot;: &quot;B 指令，放好物体后抽屉被改为半开。&quot;, &quot;success&quot;: &quot;重新检查并恢复全开终态。&quot;, &quot;claim&quot;: &quot;D3，G-P；根据真实关节状态纠正。&quot;}, &quot;GP&quot;: {&quot;instruction&quot;: &quot;G 指令，放好物体后施加相同半开扰动。&quot;, &quot;success&quot;: &quot;关闭半开的抽屉，保留已完成的取物结果。&quot;, &quot;claim&quot;: &quot;D4；新组合与关节状态变化下的闭环执行。&quot;}}, &quot;axis&quot;: &quot;G-C&quot;, &quot;boundary&quot;: &quot;全开/关闭容差按抽屉有效行程锁定。不能直接证明理解因果；需观察是否根据状态采取不同动作。参考：RoboCasa365、RLBench、RoboDojo。&quot;, &quot;previews&quot;: {&quot;B&quot;: &quot;取物后保持抽屉全开&quot;, &quot;G&quot;: &quot;取物后关闭抽屉&quot;, &quot;P&quot;: &quot;取物后抽屉变为半开&quot;, &quot;GP&quot;: &quot;新终态 + 状态变化&quot;}, &quot;sources&quot;: [{&quot;name&quot;: &quot;RoboDojo&quot;, &quot;url&quot;: &quot;https://robodojo-benchmark.com/&quot;}, {&quot;name&quot;: &quot;RLBench&quot;, &quot;url&quot;: &quot;https://github.com/stepjam/RLBench&quot;}, {&quot;name&quot;: &quot;RoboCasa365&quot;, &quot;url&quot;: &quot;https://robocasa.ai/&quot;}]}, {&quot;id&quot;: &quot;T05-001&quot;, &quot;title&quot;: &quot;插入指定深度的有向插接件&quot;, &quot;category&quot;: &quot;插接、装配与拆卸&quot;, &quot;short&quot;: &quot;插接、装配与拆卸&quot;, &quot;mini&quot;: &quot;深度插接&quot;, &quot;core&quot;: true, &quot;scene&quot;: &quot;断电的有键位插接件与匹配插座；深度标尺可见。平台：具备相应精密操作能力的桌面机械臂。&quot;, &quot;training&quot;: &quot;练习对齐和插入至 40%、80% 行程；测试目标 60% 未出现在适配示例中。固定同一连接器，不同时测试未知几何。&quot;, &quot;common&quot;: &quot;方向正确、达到指定深度 ±5% 总行程并保持 3 秒，不能通过挤压变形达到判定。接触力和速度限制在硬件/仿真可行性校准后锁定。&quot;, &quot;configs&quot;: {&quot;B&quot;: {&quot;instruction&quot;: &quot;插入到标尺 80% 位置。&quot;, &quot;success&quot;: &quot;深度处于 75%—85%。&quot;, &quot;claim&quot;: &quot;D3；熟悉精密插接。&quot;}, &quot;G&quot;: {&quot;instruction&quot;: &quot;插入到标尺 60% 位置。&quot;, &quot;success&quot;: &quot;深度处于 55%—65%。&quot;, &quot;claim&quot;: &quot;D3，G-Q；对留出中间深度的插值迁移。&quot;}, &quot;P&quot;: {&quot;instruction&quot;: &quot;B 指令；抓起插接件后、接触前，插座向侧方移动 2 厘米并静止。&quot;, &quot;success&quot;: &quot;在新插座位置达到 80% 深度容差。&quot;, &quot;claim&quot;: &quot;D4，G-P；接触前重定位。&quot;}, &quot;GP&quot;: {&quot;instruction&quot;: &quot;G 指令，施加相同插座位移。&quot;, &quot;success&quot;: &quot;在新位置达到 60% 深度容差。&quot;, &quot;claim&quot;: &quot;D4；连续目标迁移在定位扰动下保持。&quot;}}, &quot;axis&quot;: &quot;G-Q&quot;, &quot;boundary&quot;: &quot;这是连续目标插值，不是新技能，也不是任意连接器泛化。参考：RoboDojo、ManiSkill；连续目标设计参考 ARNOLD。&quot;, &quot;previews&quot;: {&quot;B&quot;: &quot;插入深度 80%&quot;, &quot;G&quot;: &quot;留出深度 60%&quot;, &quot;P&quot;: &quot;插座横移 2 cm&quot;, &quot;GP&quot;: &quot;60% 深度 + 插座位移&quot;}, &quot;sources&quot;: [{&quot;name&quot;: &quot;RoboDojo&quot;, &quot;url&quot;: &quot;https://robodojo-benchmark.com/&quot;}, {&quot;name&quot;: &quot;ManiSkill&quot;, &quot;url&quot;: &quot;https://maniskill.readthedocs.io/en/latest/tasks/index.html&quot;}, {&quot;name&quot;: &quot;ARNOLD&quot;, &quot;url&quot;: &quot;https://arnold-benchmark.github.io/&quot;}]}, {&quot;id&quot;: &quot;T06-001&quot;, &quot;title&quot;: &quot;清扫目标区域且保留非目标物&quot;, &quot;category&quot;: &quot;工具使用与表面作业&quot;, &quot;short&quot;: &quot;工具与表面作业&quot;, &quot;mini&quot;: &quot;区域清扫&quot;, &quot;core&quot;: true, &quot;scene&quot;: &quot;桌面固定红、蓝两个区域，每区有 10 个尺寸一致的可扫颗粒；一把适配夹爪的短柄刷和固定收集盒。平台：可持工具的桌面机械臂。&quot;, &quot;training&quot;: &quot;分别练习清扫红区和蓝区，并保留另一片区域；不提供“红区后蓝区”的组合示例。颜色不是颗粒本身的属性。&quot;, &quot;common&quot;: &quot;被要求清扫的每个区域至少 9/10 个颗粒进入收集盒，非目标区域的颗粒仍留在该区域，颗粒不掉落桌外。顺序任务必须先达到红区清扫阈值，再开始清扫蓝区。&quot;, &quot;configs&quot;: {&quot;B&quot;: {&quot;instruction&quot;: &quot;只清扫红区，蓝区不要动。&quot;, &quot;success&quot 365&quot;, &quot;url&quot;: &quot;https://robocasa.ai/&quot;}, {&quot;name&quot;: &quot;BEHAVIOR&quot;, &quot;url&quot;: &quot;https://behavior.stanford.edu/knowledgebase/tasks/&quot;}, {&quot;name&quot;: &quot;ALFRED&quot;, &quot;url&quot;: &quot;https://github.com/askforalfred/alfred&quot;}]}, {&quot;id&quot;: &quot;T11-001&quot;, &quot;title&quot;: &quot;按身份和顺序交接物体&quot;, &quot;category&quot;: &quot;交接、协作与交互&quot;, &quot;short&quot;: &quot;交接、协作与交互&quot;, &quot;mini&quot;: &quot;身份顺序交接&quot;, &quot;core&quot;: false, &quot;scene&quot;: &quot;两个带可辨认身份标志的接收者 A/B、两个物体和交接区；接收者按固定协议提供“准备接收”信号。后续可先用受控机器人接收者实现。&quot;, &quot;training&quot;: &quot;分别练习向 A 和 B 交付单个物体，练习识别接收就绪信号；不提供“先 A 后 B”的连续交付示例。&quot;, &quot;common&quot;: &quot;正确物体交给正确身份；必须等接收者已承托且准备就绪才释放；物体不掉落、不夹碰接收者。承托事实可通过允许观测识别。&quot;, &quot;configs&quot;: {&quot;B&quot;: {&quot;instruction&quot;: &quot;把物体 1 交给 A。&quot;, &quot;success&quot;: &quot;A 承托并接收后机器人释放。&quot;, &quot;claim&quot;: &quot;D3；熟悉交接流程。&quot;}, &quot;G&quot;: {&quot;instruction&quot;: &quot;先把物体 1 交给 A，再把物体 2 交给 B。&quot;, &quot;success&quot;: &quot;物体、身份、顺序与释放条件全部正确。&quot;, &quot;claim&quot;: &quot;D4，G-C；交接流程组合。&quot;}, &quot;P&quot;: {&quot;instruction&quot;: &quot;B 指令；机器人尚未进入交接区时，A 的接收手位置横移 10 厘米并重新示意就绪。&quot;, &quot;success&quot;: &quot;向新位置交接，不向旧位置释放。&quot;, &quot;claim&quot;: &quot;D4，G-P；交接目标位置更新。&quot;}, &quot;GP&quot;: {&quot;instruction&quot;: &quot;G 指令；仅在第一次交接前对 A 施加相同位移。&quot;, &quot;success&quot;: &quot;完成调整后的首次交接并继续向 B 交付。&quot;, &quot;claim&quot;: &quot;D5；动态交接与留出流程结合。&quot;}}, &quot;axis&quot;: &quot;G-C&quot;, &quot;boundary&quot;: &quot;对受控接收者成功不代表任意人群中的协作可靠性；需要另测不同人、速度、信号与遮挡。参考：RoboTwin 的交接任务；企业协作演示作为场景来源，不等同已有统一测评。&quot;, &quot;previews&quot;: {&quot;B&quot;: &quot;物体 1 交给 A&quot;, &quot;G&quot;: &quot;先交给 A，再交给 B&quot;, &quot;P&quot;: &quot;A 接收手位移 10 cm&quot;, &quot;GP&quot;: &quot;新顺序 + 手位变化&quot;}, &quot;sources&quot;: [{&quot;name&quot;: &quot;RoboTwin&quot;, &quot;url&quot;: &quot;https://robotwin-platform.github.io/&q
